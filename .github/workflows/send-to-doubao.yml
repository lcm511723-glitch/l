name: Send sync to Doubao

on:
  push:
    paths:
      - 'sync.txt'
  workflow_dispatch:

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send QQ SMTP mail
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_PASS: ${{ secrets.QQ_SMTP_PASS }}
          TO_EMAIL: iuph1375@agent.qq.com
        run: |
          python - <<'PY'
          import os, ssl, smtplib
          from email.mime.text import MIMEText
          from email.header import Header
          from datetime import datetime, timezone, timedelta

          sender = os.environ['QQ_EMAIL']
          password = os.environ['QQ_SMTP_PASS']
          recipient = os.environ['TO_EMAIL']
          with open('sync.txt', 'r', encoding='utf-8') as f:
              body = f.read()

          bj = timezone(timedelta(hours=8))
          now = datetime.now(bj)
          subject = f"GPT思想同步测试｜北京时间 {now:%Y-%m-%d %H:%M}"

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['From'] = sender
          msg['To'] = recipient
          msg['Subject'] = Header(subject, 'utf-8')

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL('smtp.qq.com', 465, context=context, timeout=30) as server:
              server.login(sender, password)
              server.sendmail(sender, [recipient], msg.as_string())
          print('MAIL_SENT')
          PY
